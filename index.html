<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Candlestick Chart</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/split.js/1.6.5/split.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>Stock Candlestick Chart</h1>
        
        <div class="input-section">
            <div class="ticker-input-wrapper">
                <input type="text" id="tickerInput" placeholder="Enter ticker symbol (e.g., SPY, GOOG)" maxlength="10">
                <div class="ticker-search-dropdown" id="tickerDropdown" style="display: none;"></div>
            </div>
            <button id="weeklyToggle" class="toggle-btn">Weekly</button>
            <button id="loadBtn">Load Chart</button>
        </div>
        
        <div id="errorMsg" class="error-message"></div>
        
        <div class="chart-wrapper" id="mainWrapper">
            <div id="chartPrice" class="split-window"></div>
            <div id="chartRSI" class="split-window"></div>
            <div id="chartStoch" class="split-window"></div>
            <div id="chartMACD" class="split-window"></div>
        </div>
        
        <div class="company-info-wrapper" id="companyInfoWrapper" style="display: none;">
            <h2 id="companyName">Company Information</h2>
            <div class="company-details" id="companyDetails">
                <!-- Info will be populated here -->
            </div>
            <div class="company-summary">
                <h3>Business Summary</h3>
                <p id="companySummary"></p>
            </div>
            
            <div class="fear-greed-section" id="fearGreedSection" style="display: none;">
                <h3>CNN Fear & Greed Index</h3>
                <div class="fear-greed-bar-wrapper">
                    <div class="fear-greed-bar" id="fearGreedBar"></div>
                    <span class="fear-greed-value" id="fearGreedValue"></span>
                </div>
                <div class="fear-greed-label" id="fearGreedLabel"></div>
                <div class="fear-greed-date" id="fearGreedDate"></div>
            </div>
        </div>
    </div>

    <!-- Added timestamp to force browser to load latest JS -->
    <script src="app.js?v=13"></script>
</body>
</html>
